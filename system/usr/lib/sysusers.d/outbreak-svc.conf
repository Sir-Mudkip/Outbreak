# Rootless Podman services run as this user. See docs/build-stages.md.
# systemd 259's sysusers requires the group pre-declared when a "u" line
# gives both uid and gid explicitly (else: "please create GID 880").
g svc 880
u svc 880:880 "Outbreak rootless services" /var/lib/svc /usr/sbin/nologin
m svc render
m svc video
